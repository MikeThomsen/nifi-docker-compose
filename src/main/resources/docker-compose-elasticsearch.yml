services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${elasticsearch.version}
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${x-pack.enable}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - 9200:9200
      - 9300:9300
  kibana:
    image: docker.elastic.co/kibana/kibana:${kibana.version}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
  nifi:
    hostname: nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    ports:
      - 8443:8443
    depends_on:
      - elasticsearch
    volumes:
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
      - /tmp/nifi:/opt/nifi_in
