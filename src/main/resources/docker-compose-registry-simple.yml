services:
  nifi:
    hostname: nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    ports:
      - 8443:8443
    depends_on:
      - registry.nifi
    volumes:
      - /tmp/nifi:/opt/nifi_in
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
  registry.nifi:
    hostname: registry.nifi
    image: apache/nifi-registry:${nifi.registry.version}
    container_name: registry.nifi
    ports:
      - 18080:18080
