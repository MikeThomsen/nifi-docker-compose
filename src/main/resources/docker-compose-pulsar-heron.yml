# NEEDS MANUAL REVIEW: the original streamlio/sandbox image (Pulsar + BookKeeper + Heron, last published in 2018)
# is obsolete and Apache Heron has no maintained container image, so the Heron half of this sample was dropped.
# This file now runs Apache Pulsar standalone only; decide whether to keep the pulsar-heron name or retire the file.
services:
  pulsar:
    image: apachepulsar/pulsar:${pulsar.version}
    container_name: pulsar
    hostname: pulsar
    command: bin/pulsar standalone
    ports:
      - 6650:6650
      - 8880:8080
  nifi:
    hostname: nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    ports:
      - 8443:8443
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    depends_on:
      - pulsar
    volumes:
      - /tmp/nifi:/opt/nifi_in
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
