# Integration test environment: LDAP-secured NiFi ("admin" / "secret"), a second single-user NiFi (root / rootrootroot)
# for site-to-site, plus Elasticsearch, Kibana, MongoDB and PostgreSQL. Key stores come from generate_registry_certs.sh.
services:
  ldap:
    hostname: ldap
    container_name: ldap
    image: glauth/glauth:latest
    ports:
      - "389:3893"
    volumes:
      - ./for_registry/ldap/glauth.cfg:/app/config/config.cfg:ro
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${elasticsearch.version}
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${x-pack.enable}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - 9200:9200
      - 9300:9300
  kibana:
    image: docker.elastic.co/kibana/kibana:${kibana.version}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
  mongo:
    container_name: mongo
    image: mongo:${mongo.version}
    ports:
      - 27017:27017
  nifi:
    hostname: demo.nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    environment:
      - AUTH=ldap
      - KEYSTORE_PATH=/opt/demo.nifi/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=registrydemostorepass
      - TRUSTSTORE_PATH=/opt/demo.nifi/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=registrydemostorepass
      - INITIAL_ADMIN_IDENTITY=admin
      - NIFI_WEB_PROXY_HOST=localhost:8443
      - LDAP_AUTHENTICATION_STRATEGY=SIMPLE
      - LDAP_MANAGER_DN=cn=admin,ou=people,dc=nifi,dc=com
      - LDAP_MANAGER_PASSWORD=secret
      - LDAP_USER_SEARCH_BASE=ou=people,dc=nifi,dc=com
      - LDAP_USER_SEARCH_FILTER=(cn={0})
      - LDAP_IDENTITY_STRATEGY=USE_USERNAME
      - LDAP_URL=ldap://ldap:3893
    ports:
      - 8443:8443
    depends_on:
      - ldap
      - elasticsearch
      - mongo
      - nifi2
      - postgres
    volumes:
      - /tmp/nifi:/opt/nifi_in
      - ./for_registry/demo.nifi:/opt/demo.nifi:ro
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
  nifi2:
    hostname: nifi2
    container_name: nifi2
    image: apache/nifi:${nifi.version}
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
      - NIFI_WEB_PROXY_HOST=localhost:9999
      - NIFI_WEB_HTTPS_PORT=9999
      - NIFI_REMOTE_INPUT_HOST=nifi2
    ports:
      - 9999:9999
  postgres:
    image: postgres:${postgres.version}
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: example
  adminer:
    image: adminer:${adminer.version}
    restart: always
    ports:
      - 8888:8080
