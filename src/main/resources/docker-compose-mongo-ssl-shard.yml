services:
  mongocfg:
    container_name: mongocfg
    hostname: mongocfg
    image: mongo:${mongo.version}
    command: mongod --configsvr --replSet myrs --dbpath /tmp --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /opt/mongo/mongocfg/combined.pem --tlsCAFile /opt/mongo/nifi-cert.pem
    volumes:
      - ./nifi_mongo:/opt/mongo:ro
  mongo1:
    container_name: mongo1
    hostname: mongo1
    image: mongo:${mongo.version}
    command: mongod --shardsvr --replSet myrs_int --dbpath /tmp --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /opt/mongo/mongo1/combined.pem --tlsCAFile /opt/mongo/nifi-cert.pem
    depends_on:
      - mongo2
    volumes:
      - ./nifi_mongo:/opt/mongo:ro
  mongo2:
    container_name: mongo2
    hostname: mongo2
    image: mongo:${mongo.version}
    command: mongod --shardsvr --replSet myrs_int --dbpath /tmp --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /opt/mongo/mongo2/combined.pem --tlsCAFile /opt/mongo/nifi-cert.pem
    volumes:
      - ./nifi_mongo:/opt/mongo:ro
  mongos:
    container_name: mongos
    hostname: mongos
    image: mongo:${mongo.version}
    command: mongos --configdb myrs/mongocfg:27019 --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /opt/mongo/mongos/combined.pem --tlsCAFile /opt/mongo/nifi-cert.pem
    depends_on:
      - mongocfg
    volumes:
      - ./nifi_mongo:/opt/mongo:ro
  registry.nifi:
    container_name: registry
    hostname: registry.nifi
    image: apache/nifi-registry:${nifi.registry.version}
    ports:
      - 18080:18080
  nifi:
    container_name: nifi
    image: apache/nifi:${nifi.version}
    hostname: demo.nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    ports:
      - 8443:8443
    depends_on:
      - mongo1
      - mongo2
      - mongos
      - mongocfg
    volumes:
      - ./nifi_mongo:/opt/mongo:ro
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
