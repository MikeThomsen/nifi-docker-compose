services:
  nifi:
    image: apache/nifi:${nifi.version}
    container_name: ignite_nifi
    hostname: nifi
    ports:
      - 8443:8443
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    depends_on:
      - ignite
    volumes:
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
  ignite:
    image: apacheignite/ignite:${ignite.version}
    container_name: ignite
    ports:
      - 10800:10800
      - 11211:11211
      - 47100:47100
      - 47500:47500
