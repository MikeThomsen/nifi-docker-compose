services:
  janusgraph:
    container_name: janusgraph
    hostname: janusgraph
    image: janusgraph/janusgraph:${janusgraph.version}
    ports:
      - 8182:8182
  nifi:
    hostname: nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    ports:
      - 8443:8443
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    depends_on:
      - janusgraph
    volumes:
      - /tmp/nifi:/opt/nifi_in
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
