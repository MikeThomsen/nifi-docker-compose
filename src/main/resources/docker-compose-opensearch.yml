# OpenSearch with TLS (the image's self-signed demo certificates) and password protection.
# Log in to OpenSearch and Dashboards as admin / Demo_Search-4271xZ. OpenSearch listens on https://localhost:9200.
services:
  opensearch:
    image: opensearchproject/opensearch:${opensearch.version}
    container_name: opensearch
    hostname: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Demo_Search-4271xZ
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - 9200:9200
      - 9600:9600
  dashboards:
    image: opensearchproject/opensearch-dashboards:${opensearch.version}
    container_name: opensearch-dashboards
    hostname: dashboards
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
    ports:
      - 5601:5601
    depends_on:
      - opensearch
  nifi:
    hostname: nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    ports:
      - 8443:8443
    depends_on:
      - opensearch
    volumes:
      - /tmp/nifi:/opt/nifi_in
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
