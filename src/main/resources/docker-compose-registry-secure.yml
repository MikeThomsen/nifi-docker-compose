# Secure NiFi + NiFi Registry samples with LDAP login. Every LDAP user ("admin", "test") has the password "secret".
# Key/trust stores come from generate_registry_certs.sh (store password: registrydemostorepass).
services:
  ldap:
    hostname: ldap
    container_name: ldap
    image: glauth/glauth:latest
    ports:
      - 3893:3893
    volumes:
      - ./for_registry/ldap/glauth.cfg:/app/config/config.cfg:ro
  nifi:
    hostname: demo.nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    environment:
      - AUTH=ldap
      - KEYSTORE_PATH=/opt/demo.nifi/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=registrydemostorepass
      - TRUSTSTORE_PATH=/opt/demo.nifi/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=registrydemostorepass
      - INITIAL_ADMIN_IDENTITY=admin
      - NIFI_WEB_PROXY_HOST=localhost:8443
      - LDAP_AUTHENTICATION_STRATEGY=SIMPLE
      - LDAP_MANAGER_DN=cn=admin,ou=people,dc=nifi,dc=com
      - LDAP_MANAGER_PASSWORD=secret
      - LDAP_USER_SEARCH_BASE=ou=people,dc=nifi,dc=com
      - LDAP_USER_SEARCH_FILTER=(cn={0})
      - LDAP_IDENTITY_STRATEGY=USE_USERNAME
      - LDAP_URL=ldap://ldap:3893
    ports:
      - 8443:8443
    depends_on:
      - ldap
      - prov.nifi
      - registry.nifi
    volumes:
      - /tmp/nifi:/opt/nifi_in
      - ./for_registry/demo.nifi:/opt/demo.nifi:ro
      - ./for_registry/nifi-ca.pem:/opt/nifi-ca.pem:ro
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
  prov.nifi:
    hostname: prov.nifi
    container_name: prov.nifi
    image: apache/nifi:${nifi.version}
    environment:
      - AUTH=ldap
      - KEYSTORE_PATH=/opt/prov.nifi/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=registrydemostorepass
      - TRUSTSTORE_PATH=/opt/prov.nifi/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=registrydemostorepass
      - INITIAL_ADMIN_IDENTITY=admin
      - NIFI_WEB_PROXY_HOST=localhost:444
      - NIFI_REMOTE_INPUT_HOST=prov.nifi
      - LDAP_AUTHENTICATION_STRATEGY=SIMPLE
      - LDAP_MANAGER_DN=cn=admin,ou=people,dc=nifi,dc=com
      - LDAP_MANAGER_PASSWORD=secret
      - LDAP_USER_SEARCH_BASE=ou=people,dc=nifi,dc=com
      - LDAP_USER_SEARCH_FILTER=(cn={0})
      - LDAP_IDENTITY_STRATEGY=USE_USERNAME
      - LDAP_URL=ldap://ldap:3893
    depends_on:
      - ldap
      - registry.nifi
    ports:
      - 444:8443
    volumes:
      - ./for_registry/prov.nifi:/opt/prov.nifi:ro
  registry.nifi:
    hostname: registry.nifi
    image: apache/nifi-registry:${nifi.registry.version}
    container_name: registry.nifi
    depends_on:
      - ldap
    volumes:
      - ./for_registry/registry.nifi:/opt/registry.nifi:ro
    ports:
      - 18443:18443
    environment:
      - AUTH=ldap
      - KEYSTORE_PATH=/opt/registry.nifi/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=registrydemostorepass
      - TRUSTSTORE_PATH=/opt/registry.nifi/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=registrydemostorepass
      - INITIAL_ADMIN_IDENTITY=admin
      - LDAP_AUTHENTICATION_STRATEGY=SIMPLE
      - LDAP_MANAGER_DN=cn=admin,ou=people,dc=nifi,dc=com
      - LDAP_MANAGER_PASSWORD=secret
      - LDAP_USER_SEARCH_BASE=ou=people,dc=nifi,dc=com
      - LDAP_USER_SEARCH_FILTER=(cn={0})
      - LDAP_IDENTITY_STRATEGY=USE_USERNAME
      - LDAP_URL=ldap://ldap:3893
