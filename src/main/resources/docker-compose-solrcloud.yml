services:
  zookeeper:
    image: zookeeper:${zookeeper.version}
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - 2181:2181
  solr1:
    hostname: solr1
    container_name: solr1
    image: solr:${solr.version}
    environment:
      - ZK_HOST=zookeeper:2181
    ports:
      - 8983:8983
    depends_on:
      - zookeeper
    command: solr-foreground
  solr2:
    hostname: solr2
    container_name: solr2
    image: solr:${solr.version}
    environment:
      - ZK_HOST=zookeeper:2181
    ports:
      - 8984:8983
    depends_on:
      - zookeeper
    command: solr-foreground
  nifi:
    hostname: nifi
    image: apache/nifi:${nifi.version}
    container_name: nifi
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=root
      - SINGLE_USER_CREDENTIALS_PASSWORD=rootrootroot
    ports:
      - 8443:8443
    depends_on:
      - solr1
      - solr2
    volumes:
      - /tmp/nifi:/opt/nifi_in
      - ./extensions:/opt/nifi/nifi-current/nar_extensions
